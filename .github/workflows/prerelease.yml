name: Build, test, and publish prerelease on npm

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  pkg_name: deltakit-visualise

concurrency:
  # Never cancel a publish half-way; queue instead.
  group: prerelease
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test with coverage
        run: pnpm vitest run --coverage
      - name: Geometry baseline tests
        run: pnpm run test:geometry

  pack:
    name: Set prerelease version and pack
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bump the patch component so the prerelease sorts *below* the release it
      # leads to: 0.6.0 -> 0.6.1-dev.<epoch>.g<sha>. Not committed back to main;
      # package.json in git keeps its stable version.
      - name: Set prerelease version with timestamp and short commit hash
        id: version
        run: |
          NEXT=$(node -p "const v=require('./package.json').version.split('-')[0].split('.').map(Number); [v[0], v[1], v[2] + 1].join('.')")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          SECS_SINCE_EPOCH=$(date +%s)
          VERSION="${NEXT}-dev.${SECS_SINCE_EPOCH}.g${COMMIT_HASH}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Prerelease version: $VERSION"

      # Must run *after* the version bump: vite bakes npm_package_version into
      # the bundle and renders it in the UI.
      - name: Build
        run: pnpm run build

      - name: Pack tarball
        run: |
          mkdir -p ./pkg
          npm pack --pack-destination ./pkg

      - name: Check tarball contents
        run: |
          TARBALL=$(ls ./pkg/*.tgz)
          echo "Packed $TARBALL"
          tar -tzf "$TARBALL"
          for f in package/dist/deltakit-visualise.umd.js package/dist/deltakit-visualise.lite.umd.js; do
            if ! tar -tzf "$TARBALL" | grep -qx "$f"; then
              echo "::error::$f missing from tarball"
              exit 1
            fi
          done

      - name: Upload tarball artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.pkg_name }}-prerelease
          path: ./pkg/
          retention-days: 1

  smoke-test:
    name: Install tarball and resolve entrypoints
    needs: [pack]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.pkg_name }}-prerelease
          path: ./pkg/
      # Resolve rather than import: the bundle injects CSS at module evaluation
      # and needs a DOM, so requiring it under bare Node would fail for reasons
      # that have nothing to do with packaging.
      - name: Install into a scratch project and resolve
        shell: bash
        run: |
          mkdir scratch && cd scratch
          npm init -y >/dev/null
          npm install ../pkg/*.tgz
          node -p "require.resolve('${{ env.pkg_name }}')"

  publish:
    name: Publish prerelease to npm
    needs: [smoke-test]
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    uses: ./.github/workflows/publish.yml
    with:
      # env context is unavailable in reusable-workflow inputs; keep in sync
      # with env.pkg_name above.
      artifact-name: deltakit-visualise-prerelease
      # The dev tag is load-bearing: without it these land on `latest` and
      # `npm install deltakit-visualise` starts serving unreleased builds.
      dist-tag: dev
    secrets: inherit
