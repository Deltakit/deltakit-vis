name: Build, test, and publish release on npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  pkg_name: deltakit-visualise

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validation:
    name: Validate version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate project version against tag and registry
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A release must name a stable version; prereleases come from prerelease.yml.
          if [[ "$VERSION" == *-* ]]; then
            echo "::error::package.json version $VERSION is a prerelease — releases must be stable (MAJOR.MINOR.PATCH)"
            exit 1
          fi

          # On a release event use that release's tag; on manual dispatch fall
          # back to the highest stable tag in the repo.
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            git fetch --tags --quiet
            TAG=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          fi
          TAG_VERSION="${TAG#v}"

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version $VERSION does not match release tag $TAG — bump the version in package.json to $TAG_VERSION (or retag)"
            exit 1
          fi

          # npm would reject the republish anyway, but with an opaque 403.
          if npm view "${{ env.pkg_name }}@$VERSION" version >/dev/null 2>&1; then
            echo "::error::${{ env.pkg_name }}@$VERSION is already published on npm — bump the version in package.json before releasing"
            exit 1
          fi

          echo "Releasing $VERSION"

  test:
    name: Test
    needs: [validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test with coverage
        run: pnpm vitest run --coverage
      - name: Geometry baseline tests
        run: pnpm run test:geometry

  pack:
    name: Build and pack
    needs: [validation, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Pack tarball
        run: |
          mkdir -p ./pkg
          npm pack --pack-destination ./pkg
      - name: Check tarball contents
        run: |
          TARBALL=$(ls ./pkg/*.tgz)
          echo "Packed $TARBALL"
          tar -tzf "$TARBALL"
          for f in package/dist/deltakit-visualise.umd.js package/dist/deltakit-visualise.lite.umd.js; do
            if ! tar -tzf "$TARBALL" | grep -qx "$f"; then
              echo "::error::$f missing from tarball"
              exit 1
            fi
          done
      - name: Upload tarball artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.pkg_name }}
          path: ./pkg/
          retention-days: 1

  smoke-test:
    name: Install tarball and resolve entrypoints
    needs: [pack]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.pkg_name }}
          path: ./pkg/
      # Resolve rather than import: the bundle injects CSS at module evaluation
      # and needs a DOM, so requiring it under bare Node would fail for reasons
      # that have nothing to do with packaging.
      - name: Install into a scratch project and resolve
        shell: bash
        run: |
          mkdir scratch && cd scratch
          npm init -y >/dev/null
          npm install ../pkg/*.tgz
          node -p "require.resolve('${{ env.pkg_name }}')"

  publish:
    name: Publish release to npm
    needs: [validation, smoke-test]
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    uses: ./.github/workflows/publish.yml
    with:
      # env context is unavailable in reusable-workflow inputs; keep in sync
      # with env.pkg_name above.
      artifact-name: deltakit-visualise
      dist-tag: latest
    secrets: inherit
